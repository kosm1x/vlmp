services:
  vlmp:
    # Use the published image once you push one to GHCR:
    #   image: ghcr.io/kosm1x/vlmp:latest
    # Or build locally from the repo:
    build: .
    # `:latest` only exists AFTER a version tag is pushed and the Release
    # workflow (.github/workflows/release.yml) publishes to GHCR. From a full
    # checkout this is safe — with `build: .` present, Compose falls back to
    # building the image locally when the pull finds nothing. A standalone
    # compose file (no build context) would hard-fail here until the first
    # image is published.
    image: ghcr.io/kosm1x/vlmp:latest
    container_name: vlmp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # REQUIRED in production. Generate once with:  openssl rand -hex 32
      VLMP_JWT_SECRET: "${VLMP_JWT_SECRET:?set VLMP_JWT_SECRET in your environment or .env file}"
      # Optional: metadata enrichment
      VLMP_TMDB_API_KEY: "${VLMP_TMDB_API_KEY:-}"
      # Optional: federation identity
      VLMP_SERVER_NAME: "${VLMP_SERVER_NAME:-VLMP}"
      VLMP_PUBLIC_URL: "${VLMP_PUBLIC_URL:-}"
      # Transcode tuning (see .env.example)
      VLMP_MAX_TRANSCODE_SESSIONS: "${VLMP_MAX_TRANSCODE_SESSIONS:-4}"
      VLMP_TRANSCODE_PRESET: "${VLMP_TRANSCODE_PRESET:-veryfast}"
      VLMP_OPENSUBTITLES_API_KEY: "${VLMP_OPENSUBTITLES_API_KEY:-}"
      VLMP_RATE_LIMIT_MAX: "${VLMP_RATE_LIMIT_MAX:-600}"
      VLMP_MIN_DURATION_SECONDS: "${VLMP_MIN_DURATION_SECONDS:-120}"
      # Behind a reverse proxy, so rate limits key on the real client instead of
      # the proxy. Compose only forwards keys named here, so without this line the
      # README's proxy guidance is unreachable on the Docker path. See the config
      # table in README.md for the accepted values.
      VLMP_TRUST_PROXY: "${VLMP_TRUST_PROXY:-}"
      # VLMP_DATA_DIR is deliberately NOT forwarded: the volume below mounts the
      # data directory at /data, and pointing the app elsewhere would silently
      # write into the container's ephemeral layer. Change the volume instead.
    volumes:
      # Persistent state: SQLite db, transcode cache, backups.
      #
      # A NAMED VOLUME, not `./data`. The container runs as `node` (uid 1000),
      # and a bind mount to a host path that does not exist yet gets created by
      # the daemon as root:root — so the very first `docker compose up` on a
      # fresh clone failed `mkdir /data/transcode` with EACCES and restarted
      # forever. `data/` is gitignored, so the fresh clone is the normal case,
      # which made this the documented quick start's default outcome.
      #
      # A named volume is initialised from the image, inheriting the Dockerfile's
      # `chown -R node:node /data`, so it is writable with no host-side setup.
      # Verified: bind mount → RestartCount 7 and climbing; named volume →
      # healthy, 0 restarts, /data owned by 1000:1000.
      #
      # Your data is still yours and still on your disk:
      #   inspect   docker volume inspect vlmp-data
      #   back up   docker run --rm -v vlmp-data:/d -v "$PWD:/out" alpine \
      #               tar czf /out/vlmp-data.tar.gz -C /d .
      #   restore   docker run --rm -v vlmp-data:/d -v "$PWD:/in" alpine \
      #               tar xzf /in/vlmp-data.tar.gz -C /d
      #
      # ⚠ UPGRADING? EVERY released version up to and including v0.1.9.8
      # bind-mounted `./data`. Switching to this volume does NOT move your
      # database — the server starts clean, with an empty library and no
      # accounts, and nothing warns you (it is a healthy container, just a new
      # disk). With the stack stopped:
      #   docker run --rm -v "$PWD/data":/from -v vlmp-data:/to \
      #     alpine sh -c 'cp -a /from/. /to/ && chown -R 1000:1000 /to'
      # The chown matters: cp -a preserves ownership, and a root-owned ./data
      # (what the daemon created if you ever hit the old crash-loop) would carry
      # root into the volume and break startup exactly as before.
      # Or keep your existing layout by using `- ./data:/data` below instead
      # (that path needs `sudo chown 1000:1000 data` once).
      #
      # Prefer a host directory anyway? Replace this line with `- ./data:/data`
      # and create it yourself first, owned by uid 1000:
      #   mkdir -p data && sudo chown 1000:1000 data
      - vlmp-data:/data
      # Your media library — READ ONLY. Point the left side at your files.
      # Add one line per library root; match the paths you register in the UI.
      - /path/to/your/media:/media:ro
      # Example of multiple roots:
      # - /mnt/movies:/media/movies:ro
      # - /mnt/tv:/media/tv:ro
    # No `healthcheck:` here on purpose. A Compose healthcheck OVERRIDES the
    # image's, and the probe baked into the Dockerfile is strictly better: it
    # honours VLMP_PORT instead of hardcoding 8080, so it keeps working if you
    # change the port. Inherit it rather than duplicating it here.
    #
    # Cap the log so a long-running instance can't fill an SD card — Fastify logs
    # every request, and the healthcheck alone is ~2,880 requests/day.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vlmp-data:
    # `name:` is load-bearing, not cosmetic. Without it Compose prefixes the
    # volume with the project name (`vlmp_vlmp-data`), and every `docker volume`
    # command in the README — inspect, backup, restore — silently addresses a
    # DIFFERENT, empty volume that it creates on the spot. The backup recipe
    # then exits 0 having archived nothing. Pinning the name makes the
    # documented commands true, and true in a clone under any directory name.
    name: vlmp-data
    # Pinning the name also makes it HOST-GLOBAL: two checkouts of VLMP on the
    # same machine share this volume, where Compose's project prefix would have
    # kept them apart. That is the right trade for a single-instance media
    # server (the docs stay true), but if you deliberately run two, give one of
    # them a different `name:` — two servers on one SQLite file will corrupt it.
    # `docker compose down` keeps it; only `down -v` deletes it, so stopping or
    # upgrading cannot lose your library database.

# When you register library folders in the VLMP admin UI, use the CONTAINER
# paths (e.g. /media/movies), not the host paths.
