name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

# Nothing here writes anything: no publish, no comment, no commit. Declared
# explicitly so the jobs stop inheriting whatever the repository default happens
# to be — these jobs run `npm ci`, which executes dependency lifecycle scripts.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a rapid second push).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test (Node 22)
    runs-on: ubuntu-latest
    # Backstop only — the Test step below bounds itself at 300s, so in a healthy
    # world this never fires. Kept because a step-level guard cannot cover a hang
    # in setup-node or apt.
    #
    # Do NOT read a 20-minute job here as "the 15-minute guard fired late": it
    # fires exactly on time, then GitHub allows a 5-minute cancellation grace
    # before hard-killing. Two untouched hangs on 2026-07-25 (runs 30162027944
    # and 30164977441, different branches) each ran 20m01s to the second — 15:00
    # + 5:00 — which is the signature of a process that ignores the runner's
    # termination signal, not of a late timer.
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs so a retagged upstream can't change what
      # runs here. Refreshed by hand since 2026-07-27 — automated version updates
      # were removed; repository-level Dependabot security updates still cover CVEs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The suite spawns real ffmpeg/ffprobe (probe, transcode pacing, thumbs,
      # subtitle extraction); the Linux-only tests are not skipped here.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Bounded and redirected on purpose. Three runs on 2026-07-25 hung here and
      # produced ZERO evidence, because a job that ends `cancelled` uploads no
      # logs at all (verified: `gh run view --log` returns BlobNotFound for both
      # a run I force-cancelled and one I never touched). Relying on
      # `timeout-minutes` therefore guarantees the one outcome we cannot debug.
      #
      # Two separate mechanisms are needed, and neither substitutes for the other:
      #
      #  1. `timeout` makes the STEP fail (exit 124/137) instead of the JOB being
      #     cancelled, so the logs — including any hanging-process dump from
      #     vitest.config.ts — actually upload.
      #  2. The redirect to a file is what lets the step finish at all. The step
      #     stays alive while ANY descendant holds its stdout pipe, so a wedged
      #     ffmpeg outliving node keeps the runner waiting even though the test
      #     process is gone. Sending output to a file breaks that inheritance;
      #     `timeout` alone does not (verified locally on coreutils 9.4: a
      #     grandchild that ignores SIGTERM survives, and timeout still exits 124
      #     because its direct child died, so --kill-after never reaches it).
      #
      # 300s against a ~10s suite: wide enough that a slow runner is never the
      # cause, narrow enough to fail well inside the 15-minute backstop.
      - name: Test
        run: |
          # NOT `; rc=$?` — GitHub invokes step scripts as `bash -e {0}`, and
          # `set -uo pipefail` does not cancel that -e. With a bare `; rc=$?` the
          # shell exits AT the timeout line the moment npm test fails, so the cat
          # and the diagnostics below never run: the instrumentation would be
          # dead in exactly the case it exists for. Observed on master run
          # 30239937105, which reported only "exit code 137" and no test output.
          # `|| rc=$?` puts the command in an OR list, which -e does not trap.
          set -uo pipefail
          rc=0
          timeout --kill-after=60s 300 npm test >test-output.log 2>&1 || rc=$?
          cat test-output.log
          # Exact-name match: -x cannot match this script the way `pkill -f` would.
          pkill -x ffmpeg 2>/dev/null || true
          pkill -x ffprobe 2>/dev/null || true
          case $rc in
            0) ;;
            124) echo "::error::npm test exceeded 300s and was terminated — the suite normally finishes in ~10s. Check the output above for a hanging-process handle dump." ;;
            137) echo "::error::npm test ignored SIGTERM and required SIGKILL — a child process is wedged, not merely slow." ;;
            *) echo "::error::npm test failed with exit $rc" ;;
          esac
          exit $rc

      # Belt and braces for the log: `cat` above only helps if the JOB survives
      # to finish the step, and a cancelled job uploads no step logs at all.
      # `if: always()` DOES run on cancellation and on the job timeout, so those
      # are covered. It does NOT cover a runner eviction, which kills the runner
      # process itself — nothing can upload after that.
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output-${{ github.job }}-${{ github.run_attempt }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

  # Gates the ARTIFACT, not just the source. `npm test` never builds the image, so
  # without this a change that breaks the container merges green and only fails on
  # a user's machine after release.yml publishes it — e.g. a base-image bump that
  # moves the builder and runtime stages apart and breaks the native-binding ABI,
  # a broken ENTRYPOINT path, or a healthcheck that never goes healthy.
  image:
    name: Image builds & boots (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # amd64 only, native, no push: this is a gate, not a release. No QEMU, so it
      # costs a fraction of what release.yml does.
      #
      # The GHA layer cache IS worth using here, unlike in release.yml: that
      # workflow only runs on tags, whose cache scope nothing ever populates, so
      # its reads could never hit. Here master pushes populate the default-branch
      # scope and PR runs read from it. Writes are restricted to push events so PRs
      # don't each dump a ~1GB mode=max export into the repo's shared 10GB budget.
      # Bounded at the STEP so a buildx/registry stall FAILS here with its log
      # intact. Leaving it to the job-level timeout ends the job `cancelled`,
      # and a cancelled job uploads no step logs at all (BlobNotFound) — the
      # exact undebuggable outcome the test job's bounded step exists to avoid.
      - name: Build image
        timeout-minutes: 15
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: vlmp:ci
          cache-from: type=gha
          # Gate on the BRANCH, not the event. A PR run can only read the default
          # branch's scope, so exporting from a feat/** push writes a cache no
          # other run can ever read — ~1min of pure waste per push.
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,mode=max' || '' }}
          # The docker exporter that `load: true` uses cannot carry attestations.
          provenance: false

      - name: Boot it and probe /api/info
        run: |
          set -euo pipefail
          docker run -d --name vlmp-ci -p 8080:8080 \
            -e VLMP_JWT_SECRET="$(openssl rand -hex 32)" \
            vlmp:ci

          # Wait on the image's OWN HEALTHCHECK rather than reimplementing it, so a
          # broken probe definition fails this job instead of hiding behind a
          # bespoke curl loop. Docker >=25 probes every --start-interval (default
          # 5s) while still inside --start-period, so healthy normally lands in
          # ~5s, not the 30s --interval. The 120s budget below is sized for the
          # unhealthy verdict instead: start-period + retries x interval ~= 110s.
          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' vlmp-ci)
            [ "$status" = healthy ] && break
            if [ "$status" = unhealthy ]; then
              echo "::error::container reported unhealthy"
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' vlmp-ci)" != true ]; then
              echo "::error::container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "::error::container never reported healthy (last status: $status)"
            exit 1
          fi
          echo "container healthy"

          # /api/info is unauthenticated and is what TV clients and device discovery
          # hit first. Assert the derived public id shape, so a regression that
          # leaks the raw federation fingerprint fails CI.
          # --max-time so a socket that accepts but never answers fails in 10s
          # rather than blocking until the job timeout.
          body=$(curl -fsS --max-time 10 http://127.0.0.1:8080/api/info)
          echo "$body"
          jq -e '.fingerprint | test("^vlmp-[0-9a-f]{6}$")' >/dev/null <<<"$body" \
            || { echo "::error::fingerprint is not a derived public id"; exit 1; }
          jq -e '.capabilities | index("subtitles")' >/dev/null <<<"$body" \
            || { echo "::error::capabilities missing expected entry"; exit 1; }
          jq -e '.version | type == "string" and length > 0' >/dev/null <<<"$body" \
            || { echo "::error::version missing"; exit 1; }
          echo "/api/info contract OK"

      # Into a FILE + artifact, not just the step log: this job's only
      # diagnostic must survive the cancelled-job case, same reasoning as the
      # test job's upload above. tee keeps it readable inline on normal runs.
      - name: Container logs
        if: always()
        run: docker logs vlmp-ci 2>&1 | tee container.log || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-logs-${{ github.job }}-${{ github.run_attempt }}
          path: container.log
          if-no-files-found: ignore
          retention-days: 7
