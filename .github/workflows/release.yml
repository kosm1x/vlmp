name: Release

# Publishes a multi-arch container image to GHCR when a version tag is pushed.
#
# `:latest` is derived DELIBERATELY, not automatically. metadata-action's default
# `latest=auto` is unsafe for this repo, for two separate reasons:
#   * `type=ref,event=tag` reports latest=true for ANY tag with no pre-release
#     check, and Meta.setVersion latches the first value it sees and never
#     demotes it — so a `-rc` tag would silently take `:latest`.
#   * `type=raw` has no ref guard at all, so a workflow_dispatch from a branch
#     would publish that branch as `:latest` — and, since the tag-scoped rules
#     all no-op off a tag, as the ONLY tag.
# So: `flavor: latest=false` disables the automatic behaviour, and one guarded
# raw rule applies `:latest` only to a non-pre-release tag.
#
# metadata-action also never compares against existing repo tags, so on its own it
# would happily move `:latest` BACKWARD when a hotfix is cut from an older line.
# The "Is this the newest release tag?" step below closes that: `:latest` is
# applied only when the pushed tag is the highest non-pre-release tag in the repo.
# That also makes re-running an old tag's workflow harmless.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# `:latest` is a single mutable pointer — never let two releases race to write it.
# Deliberately NOT cancel-in-progress: a half-pushed manifest is worse than a queue.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ci.yml triggers on branches and PRs only, so a TAG push runs no tests at all.
  # Without this gate a tag cut from a red commit publishes straight to everyone's
  # `docker compose pull`. Mirrors ci.yml's test job rather than sharing it, to
  # keep the release path self-contained and readable.
  test:
    name: Typecheck & test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    name: Build & push image
    needs: test
    # Refuse to publish from anything that is not a version tag. workflow_dispatch
    # stays available for re-running a release from a tag ref, but picking a
    # BRANCH in the Actions UI must never overwrite the image users pull.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to commit SHAs, not mutable major tags: this job holds
      # `packages: write`, so a retagged upstream action could push an arbitrary
      # image to every user. Dependabot (.github/dependabot.yml) keeps the SHAs
      # current and surfaces major bumps as reviewable PRs.
      # fetch-depth: 0 for the full tag list — the newest-tag check below needs it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Gate for `:latest`. Compare the pushed tag against every other release tag
      # and only claim `:latest` if this one is the highest, so a hotfix cut from an
      # older line (or a re-run of an old tag's workflow) can't drag `:latest`
      # backward and silently downgrade everyone who pulls it.
      #
      # The anchored grep below also excludes pre-releases, since a `-` cannot
      # match it — correct, as they never take `:latest` or a moving pointer.
      # `sort -V` orders the 4-part scheme correctly: verified
      # 0.1.9 < 0.1.9.1 < 0.1.9.4 < 0.1.10 < 0.2.0 < 0.10.0.
      - name: Is this the newest release tag?
        id: newest
        run: |
          set -euo pipefail
          # Only version-shaped tags take part. `sort -V` orders letters AFTER
          # digits, so a single stray tag like `vnext` or `vlatest` would become
          # the permanent "newest" and silently withhold :latest from every future
          # release. The grep makes that impossible instead of unlikely.
          tags=$(git tag -l 'v*' | { grep -E '^v[0-9]+(\.[0-9]+)*$' || true; })
          if [ -z "$tags" ]; then
            echo "::error::no version-shaped tags found — cannot decide :latest"
            exit 1
          fi
          newest="v$(printf '%s\n' "$tags" | sed 's/^v//' | sort -V | tail -1)"
          echo "newest release tag: $newest | this tag: $GITHUB_REF_NAME"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "is_newest=true" >>"$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >>"$GITHUB_OUTPUT"
            # WARNING, not notice: withholding :latest means `docker compose pull`
            # gets nothing new, and that must not be a silent outcome.
            echo "::warning::$GITHUB_REF_NAME is not the newest tag ($newest) — publishing version tags but NOT :latest"
          fi

      # The scheme is 4-part (MAJOR.MINOR.PATCH.BUILD, see CONTRIBUTING.md) and
      # deliberately not semver, so metadata-action's `type=semver` rules could
      # never parse a tag: they only warned and skipped, which left a release with
      # no bare version tag and no moving pointer at all. Derive both here.
      - name: Derive version tags
        id: ver
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          n=$(printf '%s\n' "$v" | awk -F. '{print NF}')
          # Moving pointers are the proper numeric prefixes of the version:
          # 0.1.9.4 yields 0.1.9 (the patch line) and 0.1 (the minor line). A
          # 3-part tag yields only the minor line, because its patch prefix would
          # just repeat the exact version. Left empty when not applicable and
          # disabled below, so no rule can emit a bare or duplicate tag.
          series=""
          minor=""
          if [ "$n" -ge 4 ]; then series=$(printf '%s\n' "$v" | cut -d. -f1-3); fi
          if [ "$n" -ge 3 ]; then minor=$(printf '%s\n' "$v" | cut -d. -f1-2); fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "series=$series" >>"$GITHUB_OUTPUT"
          echo "minor=$minor" >>"$GITHUB_OUTPUT"
          echo "exact: $v | patch line: ${series:-(none)} | minor line: ${minor:-(none)}"

      # arm64 emulation so the image also runs on a Raspberry Pi. Only arm64 is
      # needed — the default 'all' registers ~10 unused binfmt handlers — and
      # cache-image would push the binfmt image into a cache scope this
      # tag-triggered workflow can never read back (see the build step below).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # Two immutable tags per release: the git tag verbatim (v0.1.9.4) and
          # the bare version (0.1.9.4), the conventional registry form. Then the
          # moving pointers, each requiring BOTH that this is not a pre-release
          # and that it is the newest release tag — otherwise re-running an old
          # tag's workflow, or tagging a hotfix on an older line, would drag a
          # pointer backward and silently downgrade everyone who pulls it.
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.series }},enable=${{ steps.ver.outputs.series != '' && steps.newest.outputs.is_newest == 'true' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.minor != '' && steps.newest.outputs.is_newest == 'true' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.is_newest == 'true' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM, so users can verify which commit produced an
          # image and what is inside it. Both ride in the same OCI index and are
          # pushed with the credentials already in use — no extra permissions.
          provenance: true
          # NOT `sbom: true`. That shorthand lets BuildKit resolve its default
          # scanner image by mutable tag, which would smuggle an unpinned upstream
          # into the one job holding `packages: write` — the exact thing the
          # SHA-pinning policy above exists to prevent, and one Dependabot does not
          # track. Pin the generator by digest instead. Refresh it manually when
          # bumping syft; a stale scanner only means an older SBOM format.
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          # No GHA layer cache on purpose: that cache is ref-scoped and this
          # workflow only ever runs on tags, so `cache-from` could never hit,
          # while `cache-to,mode=max` would burn ~1GB of the repo's shared 10GB
          # budget per release and evict the npm cache that gates PRs.
